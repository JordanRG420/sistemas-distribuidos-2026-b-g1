openapi: '3.0.3'
info:
  title: 'SynkroTech Customers Service API'
  version: '2.2.0'
  description: >
    Accepted HU-ARQ-30 / ADR-019 contract extension (project-owner decision 2026-11-10; publication review remains separate). Customer registration, required write contacts, bounded body-based search, ADMIN reactivation and soft deletion. The legacy list retains its exact-document filter (ADR-004 Decision 1); the new Sales autocomplete uses POST /customers/search (ADR-019), and the sale-registration saga reads a customer by id in its first step, validate-customer (ADR-007).


    Endpoints: ADR-001 §8 (create, get, update, deactivate) and ADR-004 Decision 1 (list with filters), registered in the ADR-004 Decision 6 register.


    Roles: ADMIN and SALESPERSON use ordinary customer operations; activation and INACTIVE search require ADMIN; INVENTORY has no access to customers and always receives 403. synkro-workflow reads a customer by id with its service token (customers:read, ADR-006). Customers never calls another service.


    Money does not appear in this contract. Every creation requires Idempotency-Key (ADR-005 Decision 4).

servers:
  - url: 'http://synkro-customers-api:8080/api/v1'
    description: 'Inside the platform network (not published)'

security:
  - bearerAuth: []

tags:
  - name: 'Customers'
    description: 'Customer lifecycle (ADR-001 §8, ADR-004 Decision 1)'
  - name: 'Health'
    description: 'Health check (cross-cutting.md §4)'

paths:

  # ─── Customers ─────────────────────────────────────────────────────────

  /customers:
    get:
      operationId: 'listCustomers'
      summary: 'List customers (paginated)'
      tags: [ 'Customers' ]
      description: >
        Paginated, newest first. Optional filters: identityDocument (exact match) and active. It serves both the point-of-sale lookup and the customer list of the portal (ADR-004 Decision 1). The identity document is unique across all customers, so that filter returns at most one customer.


        Without active, active and inactive customers are listed, so the point of sale can see that a customer exists but is inactive and cannot be used on a new sale. Allowed to ADMIN and SALESPERSON.


        An unknown filter or a limit out of range answers 400 VALIDATION_ERROR. ADR-004 Decision 1.
      parameters:
        - $ref: '_shared.yaml#/components/parameters/PageParam'
        - $ref: '_shared.yaml#/components/parameters/LimitParam'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
        - name: 'identityDocument'
          in: 'query'
          required: false
          description: 'Exact match on the cédula or NIT.'
          schema:
            type: 'string'
            minLength: 1
            maxLength: 30
        - name: 'active'
          in: 'query'
          required: false
          schema:
            type: 'boolean'
      responses:
        '200':
          description: 'Paginated list of customers'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                type: 'object'
                required: [ 'data', 'meta' ]
                properties:
                  data:
                    type: 'array'
                    items:
                      $ref: '#/components/schemas/CustomerResponse'
                  meta:
                    $ref: '_shared.yaml#/components/schemas/PageMeta'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

    post:
      operationId: 'createCustomer'
      summary: 'Register a customer'
      tags: [ 'Customers' ]
      description: >
        Creates an active customer. The identity document must not belong to any other customer, active or not; otherwise the answer is 422 BUSINESS_RULE_VIOLATION with identityDocument in details. Requires Idempotency-Key: the first request answers 201 with Location, the same key answers 200 with the same customer. Allowed to ADMIN and SALESPERSON. ADR-001 §8.
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: 'Idempotent replay — same customer returned, nothing created'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '201':
          description: 'Customer created'
          headers:
            Location:
              $ref: '_shared.yaml#/components/headers/Location'
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '422':
          $ref: '_shared.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

  /customers/{id}:
    get:
      operationId: 'getCustomer'
      summary: 'Get a customer by ID'
      tags: [ 'Customers' ]
      description: >-
        Returns the customer if it exists and is active; a customer that does not exist or is inactive answers 404, so a client that needs to see inactive customers uses the list with active=false. Allowed to ADMIN, SALESPERSON and the workflow's service token (customers:read), which reads the customer in saga step 1 (validate-customer). ADR-001 §8, ADR-006, ADR-007.


        An invalid UUID path identifier returns 400 VALIDATION_ERROR. This does not assert Sales' no-query policy for this operation.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 'Customer found'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

    put:
      operationId: 'updateCustomer'
      summary: 'Update a customer'
      tags: [ 'Customers' ]
      description: >-
        Full replacement of name, identity document and required email, phone and address. Historical incomplete rows stay readable but a replacement must be complete. An identity document that belongs to another customer answers 422 BUSINESS_RULE_VIOLATION with identityDocument in details. A customer that does not exist or is inactive answers 404. Allowed to ADMIN and SALESPERSON. ADR-001 §8.


        An invalid UUID path identifier returns 400 VALIDATION_ERROR. This does not assert Sales' no-query policy for this operation.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: 'Customer updated'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'
        '422':
          $ref: '_shared.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

    delete:
      operationId: 'deactivateCustomer'
      summary: 'Deactivate a customer (soft delete)'
      tags: [ 'Customers' ]
      description: >-
        Sets active = false; it never deletes the row, and the sales history of the customer stays intact. A deactivated customer cannot be linked to new sales. Answers 200 with the updated resource, not 204, so the caller sees the resulting state. Deactivating a customer that is already inactive answers 200 and changes nothing: a transition that was already done (07-api/guidelines.md, "Standard responses"). Allowed to ADMIN and SALESPERSON. ADR-001 §8.


        An invalid UUID path identifier returns 400 VALIDATION_ERROR. This does not assert Sales' no-query policy for this operation.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 'Customer deactivated (or already inactive)'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

  /customers/search:
    post:
      operationId: 'searchCustomers'
      summary: 'Bounded customer suggestions (ADR-019)'
      tags: [ 'Customers' ]
      description: >
        Read-only body-based search, no Idempotency-Key. Human ADMIN/SALESPERSON only;
        SERVICE and INVENTORY receive 403. ACTIVE is default; INACTIVE is ADMIN only.
        Trim query and count 2–100 Unicode code points. Unknown properties, null or invalid
        status/query receive 400. Case/accent folded; document exact, document prefix, then
        all name tokens in any order; wildcards are literal. Stable ties by folded name and
        UUID. At most five results, no pagination. Text must not appear in URLs/body logs.
      parameters:
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSearchRequest'
            example: {query: 'perez ana', status: 'ACTIVE'}
      responses:
        '200':
          description: 'At most five suggestions; no match is data empty, not 404'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSearchResponse'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

  /customers/{id}/activate:
    post:
      operationId: 'activateCustomer'
      summary: 'Reactivate a customer (ADMIN only; ADR-019)'
      tags: [ 'Customers' ]
      description: >
        Human ADMIN only; other authenticated roles receive 403. No request body required
        and no Idempotency-Key; a supplied body is ignored. Return the same identity, document
        and registration date. Already active is 200 with no new audit row. One conditional
        update and append-only audit insert share a transaction; audit failure rolls back.
        Concurrent/repeated activation is safe. Legacy contacts may remain null. Ordinary
        PUT cannot reactivate. Malformed/noncanonical UUID is 400; absent UUID is 404.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 'Active customer, transitioned or already active'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

  # ─── Health ────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: 'healthCheck'
      summary: 'Health check'
      tags: [ 'Health' ]
      security: []
      description: >-
        Checks connectivity to customers_schema in the shared instance (ADR-009). Public: no token required (cross-cutting.md §4).


        Effective URL: http://synkro-customers-api:8080/health. The API server prefix does not apply to this path.
      responses:
        '200':
          description: 'Healthy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: 'Healthy response shape'
                  value:
                    status: 'ok'
                    service: 'synkro-customers-api'
                    timestamp: '2026-10-24T20:00:00Z'
                    dependencies:
                      database: 'ok'
        '503':
          description: 'Unhealthy — database connectivity lost'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unhealthy:
                  summary: 'Unhealthy own-store response shape'
                  value:
                    status: 'degraded'
                    service: 'synkro-customers-api'
                    timestamp: '2026-10-24T20:00:00Z'
                    dependencies:
                      database: 'down'
    servers:
      - url: 'http://synkro-customers-api:8080'
        description: 'Unversioned service origin; this overrides the /api/v1 business server'

# ─── Components ────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: 'http'
      scheme: 'bearer'
      bearerFormat: 'JWT'
      description: >
        RS256 JWT validated locally by this service (ADR-006). The gateway only checks presence; this service verifies signature, exp and sub, and the role or permission of the caller.

  parameters:
    CustomerId:
      name: 'id'
      in: 'path'
      required: true
      schema:
        type: 'string'
        format: 'uuid'

  schemas:

    # ── Request ──────────────────────────────────────────────────────

    CustomerRequest:
      type: 'object'
      required: [ 'name', 'identityDocument', 'email', 'phone', 'address' ]
      description: 'New writes/replacement PUT require complete contacts; historical reads may be incomplete. Reject blank contacts. Email must have valid local/domain syntax, no spaces/control characters, local part at most 64 code points, ASCII domain labels 1–63, final label at least two; use punycode for international domains. Store contacts as supplied, without trimming or invented values.'
      properties:
        name: {type: 'string', minLength: 1, maxLength: 150}
        identityDocument: {type: 'string', minLength: 1, maxLength: 30}
        email: {type: 'string', format: 'email', minLength: 1, maxLength: 255}
        phone: {type: 'string', pattern: '^[0-9]{10}$', minLength: 10, maxLength: 10}
        address: {type: 'string', minLength: 1, maxLength: 255}

    CustomerResponse:
      type: 'object'
      required: [ 'customerId', 'name', 'identityDocument', 'registrationDate', 'active' ]
      description: 'Separate read model: legacy nullable contacts remain readable; write requirements must not invalidate historical responses.'
      properties:
        customerId: {type: 'string', format: 'uuid'}
        name: {type: 'string', maxLength: 150}
        identityDocument: {type: 'string', maxLength: 30}
        email: {type: 'string', nullable: true, maxLength: 255}
        phone: {type: 'string', nullable: true, maxLength: 20}
        address: {type: 'string', nullable: true, maxLength: 255}
        registrationDate: {type: 'string', format: 'date-time'}
        active: {type: 'boolean'}

    CustomerSearchRequest:
      type: 'object'
      additionalProperties: false
      required: [ 'query' ]
      properties:
        query: {type: 'string', minLength: 2, maxLength: 100, description: 'Length after whitespace trimming, in Unicode code points.'}
        status: {type: 'string', enum: [ 'ACTIVE', 'INACTIVE' ], default: 'ACTIVE', description: 'INACTIVE is human ADMIN only.'}

    CustomerSuggestion:
      type: 'object'
      additionalProperties: false
      required: [ 'customerId', 'name', 'identityDocument', 'active', 'match' ]
      properties:
        customerId: {type: 'string', format: 'uuid'}
        name: {type: 'string'}
        identityDocument: {type: 'string'}
        active: {type: 'boolean'}
        match: {type: 'string', enum: [ 'DOCUMENT_EXACT', 'DOCUMENT_PREFIX', 'NAME' ]}

    CustomerSearchResponse:
      type: 'object'
      required: [ 'data', 'meta' ]
      properties:
        data:
          type: 'array'
          maxItems: 5
          items:
            $ref: '#/components/schemas/CustomerSuggestion'
        meta:
          type: 'object'
          required: [ 'limit', 'hasMore' ]
          properties:
            limit: {type: 'integer', enum: [ 5 ]}
            hasMore: {type: 'boolean'}

    HealthResponse:
      type: 'object'
      required: [ 'status', 'service', 'timestamp' ]
      properties:
        status:
          type: 'string'
          enum: [ 'ok', 'degraded' ]
        service:
          type: 'string'
          example: 'synkro-customers-api'
        timestamp:
          type: 'string'
          format: 'date-time'
        dependencies:
          type: 'object'
          properties:
            database:
              type: 'string'
              enum: [ 'ok', 'down' ]
