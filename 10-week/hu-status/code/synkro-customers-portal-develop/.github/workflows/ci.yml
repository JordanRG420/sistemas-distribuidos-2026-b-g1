name: ci

on:
  push:
    branches: [develop, qa, main, feat/customers-management-portal]
  workflow_dispatch:
  pull_request:
    branches: [develop, qa, main]

jobs:
  check-common-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify common repository files exist
        run: |
          set -e
          test -f README.md
          test -f .gitignore
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .env.example
          echo "Common files present."
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: node --test scripts/*.test.mjs
      - run: npm run build
      - run: node scripts/check-boundary.mjs --compiled
      - run: docker compose -f deploy/compose.yml config --quiet
      - run: docker build -f deploy/Dockerfile -t customers-portal:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customers-evidence-${{ github.sha }}
          path: |
            coverage/
            dist/customers/browser/
